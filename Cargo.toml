[package]
name = "obs_church_automation"
version = "3.0.0"
authors = ["you"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
serde_derive = "1.0.228"
owo-colors = "4.3.0"
figlet-rs = "1.0.0"
open = "5.4.1"
eframe = "0.36.1"
rfd = "0.17.2"

[profile.dev]
debug = "line-tables-only"

[build]
rustflags = ["-Z", "threads=8"]

[unstable]
codegen-backend = true
